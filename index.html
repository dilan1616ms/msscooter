@font-face{font-family:Cairo;src:url(Cairo.ttf);font-weight:200 1000;font-display:swap}
html{scroll-behavior:smooth;scroll-padding-top:72px}body{font-family:Cairo,system-ui,sans-serif;background:#07080f;color:#fff;overflow-x:hidden}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bar{from{width:0}to{width:100%}}@keyframes mq{to{transform:translateX(-50%)}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes shine{from{transform:translateX(-120%) skewX(-20deg)}to{transform:translateX(320%) skewX(-20deg)}}
@keyframes swing{0%,100%{transform:rotateY(-24deg) rotateX(6deg)}50%{transform:rotateY(24deg) rotateX(-3deg)}}@keyframes swing2{0%,100%{transform:rotateY(-32deg)}50%{transform:rotateY(32deg)}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes dash{to{stroke-dashoffset:-80}}@keyframes pulse{0%{box-shadow:0 0 0 0 #d6282899}100%{box-shadow:0 0 0 16px #d6282800}}@keyframes toast{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 #fbbf2466}50%{box-shadow:0 0 22px 2px #fbbf2455}}
.fl{animation:fl 4s ease-in-out infinite}.spin{animation:spin 1s linear infinite}.mq{animation:mq 30s linear infinite}
.s3d{position:relative;transform-style:preserve-3d}.s3d>*{position:absolute;inset:0;width:100%;height:100%;overflow:visible}.s3d>img{object-fit:contain}
.sw{animation:swing 7s ease-in-out infinite}.sw2{animation:swing2 5s ease-in-out infinite}
.sh{position:relative;overflow:hidden}.sh:after{content:"";position:absolute;top:0;left:0;width:40%;height:100%;background:#fff4;animation:shine 2.8s infinite}
.rv{opacity:0;transform:translateY(30px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1)}.rv.on{opacity:1;transform:none}
.cd{transition:transform .35s,box-shadow .35s,border-color .35s}.cd:hover{transform:translateY(-8px);box-shadow:0 26px 46px -18px #d6282877;border-color:#d62828aa}
.mq2{animation:mq 28s linear infinite}#bl:hover .mq2{animation-play-state:paused}#bl{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.bi{display:flex;align-items:center;justify-content:center;margin:0 44px;opacity:.88;transition:transform .35s,opacity .35s,filter .35s}.bi:hover{opacity:1;transform:scale(1.14);filter:drop-shadow(0 0 16px #ffffff44)}.bi img{display:block;width:auto}
.lg{background:#fff;color:#111;border-radius:18px;padding:14px 26px;font-weight:900;letter-spacing:.08em;min-width:130px;text-align:center;transition:transform .3s}.lg:hover{transform:scale(1.08) rotate(-2deg)}
.pbg{position:relative;overflow:hidden;background:#11131d}.pbg:before{content:"";position:absolute;inset:-24px;background:var(--bg) center/cover;filter:blur(22px) brightness(.45) saturate(1.2)}
.pbg>img{transition:transform .6s}.cd:hover .pbg>img{transform:scale(1.06)}
.star{animation:glow 2.4s ease-in-out infinite}
#trk::-webkit-scrollbar{display:none}#md{animation:up .25s both}#tt{animation:toast .5s both}
.dot{width:10px;height:10px;border-radius:99px;background:#ffffff40;transition:.3s;display:block}.dot.on{background:#d62828;height:26px}
.pulse{animation:pulse 1.8s infinite}.lb{border:0;cursor:pointer;color:#ffffffb0;background:none;font:inherit;font-weight:800;font-size:13px;padding:6px 11px;border-radius:99px}.lb.on{background:#d62828;color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
